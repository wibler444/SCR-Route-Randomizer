<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SCR Route Generator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
<header class="hero">

    <div class="hero-badge">
      <span class="hero-dot"></span>
      STEPFORD COUNTY RAILWAY
    </div>

  <h1>
    SCR <span>ROUTE GENERATOR</span>
  </h1>

  <p class="hero-description">
    Generate random route to drive in Stepford County Railway.
  </p>

</header>
    <div class="tabs">
      <div class="operator-tabs">
        <button
          class="tab"
          data-operator="Stepford Connect"
          onclick="toggleOperator(this)"

          data-color="rgb(0, 152, 255)"
        >
          <img src="images/SC.jpg" alt="Stepford Connect">
        </button>

        <button
          class="tab"
          data-operator="Metro"
          onclick="toggleOperator(this)"

          data-color="rgb(238, 64, 68)"
        >
          <img src="images/ME.jpg" alt="Metro">
        </button>

        <button
          class="tab"
          data-operator="Stepford Express"
          onclick="toggleOperator(this)"

          data-color="rgb(255, 0, 128)"
        >
          <img src="images/SE.jpg" alt="Stepford Express">
        </button>

        <button
          class="tab"
          data-operator="Waterline"
          onclick="toggleOperator(this)"

          data-color="rgb(73, 95, 124)"
        >
          <img src="images/WL.jpg" alt="Waterline">
        </button>

        <button
          class="tab"
          data-operator="Airlink"
          onclick="toggleOperator(this)"

          data-color="rgb(226, 112, 20)"
        >

          <img src="images/AL.jpg" alt="Airlink">
        </button>
      </div>

      <div
        id="selection-info"
        class="selection-info"
>
        <span class="selection-label">
            SELECTED OPERATORS
        </span>

        <div
          id="selected-badges"
          class="selected-badges"
  >
          <span class="selection-empty">
            Choose one or more operators.
          </span>
        </div>
      </div>
    </div>

    <div class="generator">

      <div class="departure-header">

        <div class="departure-title">
          <span class="departure-light"></span>
          DEPARTURE BOARD
        </div>

        <div class="departure-status">
          RANDOM SERICE
        </div>
      </div>

      <div class="generate-container">

        <button
          class="generate"
          onclick="randomRoute()"
        >
          RANDOMIZE ROUTE
        </button>

      </div>

      <div
        id="result"
        class="empty"
      >
      </div>

    </div>

  </div>

  <footer class="site-footer">

  <div class="footer-line"></div>

  <div class="footer-content">

    <div class="footer-brand">

      <div class="footer-title">
        SCR ROUTE GENERATOR
      </div>

      <div class="footer-copyright">
        &copy; <span id="currentYear"></span>
        All Rights Reserved.
      </div>

    </div>


    <div class="footer-divider"></div>


    <div class="footer-author">

      <span class="footer-label">
        DESIGNED & DEVELOPED BY
      </span>

      <span class="footer-name">
        wibler444
      </span>

    </div>

  </div>
</footer>

  <script src="script.js"></script>

</body>
</html>
